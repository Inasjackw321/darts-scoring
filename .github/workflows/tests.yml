name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No dependencies and no build step — the engine is plain JS that runs
      # in the browser and under Node's built-in test runner unchanged.
      - name: Run tests
        run: node --test "tests-js/*.test.js"
