<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1211">
<title>Dart Scorer</title>
<meta name="description" content="Tap what you scored. Keeps 501, legs, checkouts and stats.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============================ PLAY ============================ -->
<section id="view-play" class="view is-active">
  <header class="scores" id="scores"></header>

  <div class="turn-strip">
    <div class="darts" id="turn-darts"></div>
    <div class="turn-meta">
      <span id="turn-total">0</span>
      <small>this turn</small>
    </div>
  </div>

  <p class="checkout" id="checkout-hint"></p>
  <p class="flash" id="flash"></p>

  <div class="keypad">
    <div class="mult-row" role="group" aria-label="Multiplier">
      <button class="mult is-on" data-mult="1" aria-pressed="true">Single</button>
      <button class="mult" data-mult="2" aria-pressed="false">Double</button>
      <button class="mult" data-mult="3" aria-pressed="false">Treble</button>
    </div>
    <div class="numbers" id="numbers"></div>
    <div class="specials">
      <button class="key key-special" data-special="25">25</button>
      <button class="key key-special" data-special="bull">Bull</button>
      <button class="key key-special" data-special="miss">Miss</button>
    </div>
  </div>

  <div class="actions">
    <button id="btn-undo" class="btn">Undo</button>
    <button id="btn-stats" class="btn">Stats</button>
    <button id="btn-setup" class="btn">New game</button>
  </div>
</section>

<!-- ============================ STATS ============================ -->
<section id="view-stats" class="view">
  <header class="bar">
    <h1>Match stats</h1>
    <button id="btn-close-stats" class="btn btn-quiet">Back</button>
  </header>

  <div id="stats-summary" class="tiles"></div>

  <section class="card">
    <h2>Scoring</h2>
    <div class="table-scroll"><table id="stats-table"></table></div>
  </section>

  <section class="card">
    <h2>How the leg went</h2>
    <p class="muted" id="progression-caption">Score remaining after each turn.</p>
    <div id="chart-progression"></div>
  </section>

  <section class="card">
    <h2>Where the darts went</h2>
    <p class="muted">
      Shaded by how many darts landed in each region. Tapping a score records the
      region, not a spot inside it, so there is nothing finer than this to show.
    </p>
    <div id="chart-board"></div>
    <div class="table-scroll"><table id="board-table"></table></div>
  </section>
</section>

<!-- ============================ SETUP ============================ -->
<section id="view-setup" class="view">
  <header class="bar">
    <h1>New game</h1>
    <button id="btn-close-setup" class="btn btn-quiet">Cancel</button>
  </header>

  <section class="card">
    <label class="field">
      <span>Players, one per line</span>
      <textarea id="setup-players" rows="4" spellcheck="false">Player 1</textarea>
    </label>

    <fieldset class="field">
      <legend>Game</legend>
      <div class="chips" id="setup-mode">
        <button type="button" class="chip is-on" data-start="501">501</button>
        <button type="button" class="chip" data-start="301">301</button>
        <button type="button" class="chip" data-start="170">170</button>
        <button type="button" class="chip" data-countup="1">Count-up</button>
      </div>
    </fieldset>

    <label class="field">
      <span>Legs to win</span>
      <input id="setup-legs" type="number" min="1" max="21" value="1" inputmode="numeric">
    </label>

    <label class="check"><input type="checkbox" id="setup-double-out" checked> Must finish on a double</label>
    <label class="check"><input type="checkbox" id="setup-double-in"> Must start on a double</label>

    <div class="actions">
      <button id="btn-start" class="btn btn-primary">Start game</button>
    </div>
  </section>
</section>

<script src="js/engine.js"></script>
<script src="js/stats.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
